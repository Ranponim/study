<!-- <!doctype html>: 이 문서가 HTML5 문서임을 브라우저에게 알려주는 선언문입니다. 항상 문서 맨 위에 씁니다. -->
<!doctype html>
<!-- <html>: 전체 HTML 문서의 시작과 끝을 감싸는 최상위(root) 요소입니다. lang="ko"는 이 페이지의 언어가 한국어임을 알려줍니다. -->
<html lang="ko">
<!-- <head>: 화면에 직접 보이지는 않지만, 페이지의 설정 정보(메타데이터)를 담는 영역입니다. -->
<head>
  <!-- <meta charset="UTF-8">: 문자 인코딩을 UTF-8로 지정해 한글 등 모든 문자가 깨지지 않도록 합니다. -->
  <meta charset="UTF-8" />
  <!-- <meta name="viewport" ...>: 모바일 화면에서 페이지가 기기 너비에 맞게 보이도록 설정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <title>: 브라우저 탭에 표시되는 페이지 제목입니다. -->
  <title>03강 자료형</title>
</head>
<!-- <body>: 화면에 실제로 보이는 모든 내용(제목, 목록, 스크립트 등)이 들어가는 영역입니다. -->
<body>
  <!-- <h1>: 가장 큰 제목(heading)을 표시하는 태그입니다. 페이지의 대표 제목으로 사용합니다. -->
  <h1>자료형 확인하기</h1>
  <!-- <ul id="list">: 순서 없는 목록(unordered list)입니다. id="list"라는 이름표를 붙여 나중에 JavaScript로 찾을 수 있게 합니다. 지금은 비어 있고, 스크립트가 항목(<li>)을 채워 넣습니다. -->
  <ul id="list"></ul>

  <!-- <script>: 이 안에 JavaScript 코드를 작성합니다. 브라우저가 이 코드를 실행합니다. -->
  <script>
    // const name = "영희";: 변경할 수 없는 상수 name에 문자열(string) "영희"를 저장합니다.
    const name = "영희";
    // const age = 20;: 상수 age에 숫자(number) 20을 저장합니다.
    const age = 20;
    // const isStudent = true;: 상수 isStudent에 참/거짓 값(boolean) true를 저장합니다.
    const isStudent = true;
    // const empty = null;: 상수 empty에 "값이 비어 있음"을 뜻하는 null을 저장합니다.
    const empty = null;
    // let notYet;: 변수 notYet을 선언만 하고 값을 넣지 않았습니다. 이런 경우 자동으로 undefined(정의되지 않음) 상태가 됩니다.
    let notYet;

    // 위에서 만든 5개의 값을 하나의 배열(values)에 순서대로 모아 담습니다. 배열은 여러 값을 한 곳에 저장하는 자료구조입니다.
    const values = [name, age, isStudent, empty, notYet];
    // document.querySelector("#list"): HTML에서 id가 "list"인 요소(<ul>)를 찾아 변수 list에 저장합니다. 이제 이 변수로 목록을 조작할 수 있습니다.
    const list = document.querySelector("#list");

    // values.forEach(...): 배열 values의 각 원소를 하나씩 꺼내어 함수를 반복 실행합니다. 꺼낸 값은 매개변수 value에 담깁니다.
    values.forEach(function (value) {
      // console.log(value, typeof value): 개발자 도구(콘솔)에 현재 값과 그 값의 자료형(typeof 결과)을 출력합니다. 화면이 아닌 콘솔에서 확인할 수 있습니다.
      console.log(value, typeof value);

      // document.createElement("li"): 새 목록 항목 <li> 요소를 메모리에 생성해 변수 li에 담습니다. (아직 화면에는 안 보입니다.)
      const li = document.createElement("li");
      // li.textContent = ...: 만든 <li>의 텍스트 내용을 정합니다.
      //   String(value): 값을 문자열로 변환합니다(예: 숫자 20 → "20").
      //   " → ": 값과 자료형 사이를 구분하는 화살표 기호입니다.
      //   typeof value: 값의 자료형 이름을 문자열로 돌려줍니다(예: "number").
      //   +로 세 부분을 이어 붙여 "20 → number" 같은 문자열을 만듭니다.
      li.textContent = String(value) + " → " + typeof value;
      // list.appendChild(li): 완성된 <li>를 <ul>(list)의 마지막 자식으로 추가해, 드디어 화면에 보이게 만듭니다.
      list.appendChild(li);
    });
  </script>
</body>
</html>
