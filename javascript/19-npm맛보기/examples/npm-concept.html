<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>19강 npm 맛보기</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; line-height: 1.6; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>npm은 무엇일까요?</h1>
  <p>npm은 JavaScript 패키지를 설치하고 프로젝트 명령어를 관리하는 도구입니다.</p>
  <ul>
    <li><code>npm init -y</code>: package.json 만들기</li>
    <li><code>npm install 패키지명</code>: 패키지 설치하기</li>
    <li><code>npm run 명령어</code>: 프로젝트 명령 실행하기</li>
  </ul>
  <p>이 예제는 개념 설명용이라 설치 없이 열 수 있습니다.</p>
</body>
</html>
