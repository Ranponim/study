<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미니 프로젝트 04. 명언뽑기</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
      background: #f8fafc;
      min-height: 100vh;
    }
    #quote { font-size: 24px; line-height: 1.6; }
    #author { margin-top: 12px; color: #475569; }
    button {
      margin-top: 32px;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #1e293b;
      color: white;
    }
  </style>
</head>
<body>
  <h1>오늘의 명언</h1>
  <p id="quote">버튼을 눌러 명언을 받아 보세요.</p>
  <p id="author"></p>
  <button id="pickButton">명언 뽑기</button>

  <script>
    const quotes = [
      { text: "천 리 길도 한 걸음부터.", author: "노자" },
      { text: "연습이 완벽을 만든다.", author: "빈센트 반 고흐" },
      { text: "지금 시작하는 사람이 결국 가장 멀리 갑니다.", author: "익명" },
      { text: "작은 진전이라도 매일 쌓이면 큰 변화가 됩니다.", author: "익명" },
      { text: "실패는 멈춤이 아니다.", author: "마야 안젤루" },
      { text: "배움에 끝이 없다면 길게 살 게 아니라 깊게 살 길을 찾을 일이다.", author: "정약용" }
    ];

    const quoteEl = document.querySelector("#quote");
    const authorEl = document.querySelector("#author");
    const pickButton = document.querySelector("#pickButton");

    function pickQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      const quote = quotes[randomIndex];
      quoteEl.textContent = "\u201C" + quote.text + "\u201D";
      authorEl.textContent = "- " + quote.author + " -";

      const hue = Math.floor(Math.random() * 360);
      document.body.style.background = "hsl(" + hue + ", 60%, 95%)";
    }

    pickButton.addEventListener("click", pickQuote);
  </script>
</body>
</html>
