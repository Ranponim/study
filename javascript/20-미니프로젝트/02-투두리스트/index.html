<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미니 프로젝트 02. 투두리스트</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
    .done { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>투두리스트</h1>
  <form id="form">
    <input id="input" placeholder="할 일을 입력하세요" />
    <button>추가</button>
  </form>
  <p id="count"></p>
  <ul id="list"></ul>

  <script>
    const STORAGE_KEY = "todos";

    const form = document.querySelector("#form");
    const input = document.querySelector("#input");
    const listEl = document.querySelector("#list");
    const countEl = document.querySelector("#count");

    let todos = [];

    function load() {
      const saved = localStorage.getItem(STORAGE_KEY);
      todos = saved ? JSON.parse(saved) : [];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      listEl.innerHTML = "";

      todos.forEach(function (todo) {
        const li = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", function () {
          todo.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;
        if (todo.done) text.classList.add("done");

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "삭제";
        removeBtn.addEventListener("click", function () {
          todos = todos.filter(function (item) { return item.id !== todo.id; });
          save();
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(removeBtn);
        listEl.appendChild(li);
      });

      const remaining = todos.filter(function (todo) { return !todo.done; }).length;
      countEl.textContent = "남은 일: " + remaining + "개";
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const value = input.value.trim();
      if (value === "") return;

      todos.push({
        id: Date.now(),
        text: value,
        done: false
      });

      input.value = "";
      save();
      render();
    });

    load();
    render();
  </script>
</body>
</html>
