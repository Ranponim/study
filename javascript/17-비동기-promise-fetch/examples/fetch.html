<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>17강 비동기 fetch</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    button { padding: 10px 16px; }
    .card { max-width: 640px; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>fetch 예제</h1>
  <button id="loadButton">데이터 불러오기</button>
  <div id="result" class="card">버튼을 눌러 보세요.</div>

  <script>
    const loadButton = document.querySelector("#loadButton");
    const result = document.querySelector("#result");

    async function loadPost() {
      result.textContent = "불러오는 중입니다...";

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
        const post = await response.json();
        result.innerHTML = "<h2>" + post.title + "</h2><p>" + post.body + "</p>";
      } catch (error) {
        console.log(error);
        result.textContent = "네트워크 문제로 데이터를 불러오지 못했습니다. 대신 실패 처리 연습을 했습니다.";
      }
    }

    loadButton.addEventListener("click", loadPost);
  </script>
</body>
</html>
