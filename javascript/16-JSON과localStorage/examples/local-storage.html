<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16강 JSON과 localStorage</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; }
    input, button { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>localStorage 저장</h1>
  <form id="form">
    <input id="nameInput" placeholder="이름" />
    <button>저장</button>
  </form>
  <p id="savedName"></p>

  <script>
    const form = document.querySelector("#form");
    const nameInput = document.querySelector("#nameInput");
    const savedName = document.querySelector("#savedName");

    function render() {
      const userText = localStorage.getItem("user");

      if (userText === null) {
        savedName.textContent = "아직 저장된 이름이 없습니다.";
        return;
      }

      const user = JSON.parse(userText);
      savedName.textContent = "저장된 이름: " + user.name;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const user = {
        name: nameInput.value.trim()
      };

      localStorage.setItem("user", JSON.stringify(user));
      nameInput.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
