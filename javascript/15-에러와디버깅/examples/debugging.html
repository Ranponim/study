<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15강 에러와 디버깅</title>
</head>
<body>
  <h1>에러와 디버깅</h1>
  <p>F12 → Console 탭을 열고 로그를 확인하세요.</p>
  <p id="result"></p>

  <script>
    const userName = "민수";
    const score = 90;

    console.log("현재 userName:", userName);
    console.log("현재 score:", score);

    const result = document.querySelector("#result");
    result.textContent = userName + "님의 점수는 " + score + "점입니다.";

    // 아래 코드는 일부러 에러를 내는 연습용입니다.
    // 한 줄씩 주석을 풀고 Console의 에러 메시지를 읽어 보세요.

    // console.log(notDefinedValue); // ReferenceError
    // const broken = ; // SyntaxError
    // const missingElement = null;
    // missingElement.textContent = "오류"; // TypeError
  </script>
</body>
</html>
