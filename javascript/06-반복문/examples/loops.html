<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06강 반복문</title>
</head>
<body>
  <h1>반복문 예제</h1>
  <ol id="list"></ol>
  <p id="total"></p>

  <script>
    const list = document.querySelector("#list");
    let total = 0;

    for (let i = 1; i <= 10; i++) {
      total = total + i;
      const li = document.createElement("li");
      li.textContent = i + "번째 반복입니다.";
      list.appendChild(li);
    }

    console.log("1부터 10까지의 합:", total);
    document.querySelector("#total").textContent = "1부터 10까지의 합은 " + total + "입니다.";
  </script>
</body>
</html>
